# git-cliff ~ configuration for changelog generation
# https://git-cliff.org/docs/configuration
#
# Used by:
# - release-plz: for ic-doge-interface(semver)
# - release-pr.yml workflow: for ic-doge-canister (date-based)

[changelog]
header = """
# Changelog\n
All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/).\n
"""
body = """
{% if version -%}
    {% set display_version = version | trim_start_matches(pat="ic-doge-canister/") -%}
    ## [{{ display_version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits -%}
        {% set message = commit.message | split(pat="\n") | first | upper_first | trim -%}
        {% set message = message | replace(from="\\(#(\\d+)\\)", to="([#$1](https://github.com/dfinity/dogecoin-canister/pull/$1))") -%}
        - {{ message }}
    {% endfor %}
{% endfor %}\n
"""
footer = """
{% for release in releases -%}
    {% if release.version -%}
        {% if release.previous.version -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: \
                https://github.com/dfinity/dogecoin-canister\
                    /compare/{{ release.previous.version }}...{{ release.version }}
        {% endif -%}
    {% else -%}
        [unreleased]: https://github.com/dfinity/dogecoin-canister\
            /compare/{{ release.previous.version }}...HEAD
    {% endif -%}
{% endfor %}
"""
trim = true

[remote.github]
owner = "dfinity"
repo = "dogecoin-canister"

[git]
conventional_commits = true
filter_unconventional = false
commit_parsers = [
    { message = "^[a|A]dd", group = "Added" },
    { message = "^[s|S]upport", group = "Added" },
    { message = "^[r|R]emove", group = "Removed" },
    { message = "^.*: add", group = "Added" },
    { message = "^.*: support", group = "Added" },
    { message = "^.*: remove", group = "Removed" },
    { message = "^.*: delete", group = "Removed" },
    { message = "^test", group = "Fixed" },
    { message = "^fix", group = "Fixed" },
    { message = "^.*: fix", group = "Fixed" },
    { message = "^.*", group = "Changed" },
]
filter_commits = false
topo_order = false
sort_commits = "newest"