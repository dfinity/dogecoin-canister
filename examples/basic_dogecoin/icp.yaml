canisters:
  - name: backend
    recipe:
      type: "@dfinity/rust@v3.3.0"

networks:
  - name: local
    mode: managed
    image: icp-cli-network-launcher-dogecoin
    port-mapping:
      - 0:4943 # IC gateway (dynamic)

environments:
  - name: local
    network: local
    init_args:
      backend: "(variant { regtest })"

  - name: ic
    network: ic
    # Deploys to Dogecoin mainnet. The `mainnet` init variant selects the "test_key_1"
    # threshold ECDSA key, which has lower signing costs and is a good fit while there
    # are no production funds at stake. Switch to the production key "key_1" in
    # backend/src/lib.rs for real deployments. See the README
    # ("Choosing a threshold ECDSA key") and
    # https://docs.internetcomputer.org/concepts/chain-key-cryptography/#deployed-keys
    init_args:
      backend: "(variant { mainnet })"
