
name: Create Release PR

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Which package to release'
        required: true
        type: choice
        options:
          - ic-doge-canister  # Date-based, uses git-cliff
          - ic-doge-interface   # Semver , uses release-plz

# Creates a Release PR for a specific package:
# - ic-doge-canister: via git-cliff (date-based)
# - ic-doge-interface: via release-plz (semver)

jobs:
  # ===== Canister Release PR (date-based) =====
  canister-pr:
    name: Create Release PR for ic-doge-canister
    if: ${{ inputs.package == 'ic-doge-canister' }}
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Set release parameters
        run: |
          echo "INCLUDE_PATH=canister/**" >> "$GITHUB_ENV"
          echo "CHANGELOG_PATH=canister/CHANGELOG.md" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate release date
        run: |
          RELEASE_DATE=$(date +%Y-%m-%d)
          echo "RELEASE_DATE=$RELEASE_DATE" >> "$GITHUB_ENV"

      - name: Update CHANGELOG
        run: |
          # Get the previous release tag
          PREV_TAG=$(git tag --list 'release/*' --sort=-version:refname | head -n1)
          NEW_TAG="release/${{ env.RELEASE_DATE }}"
          
          # Prepend new changelog entry
          git-cliff --config cliff.toml \
            --include-path "${{ env.INCLUDE_PATH }}" \
            --tag-pattern "release/.*" \
            --prepend "${{ env.CHANGELOG_PATH }}" \
            --unreleased \
            --tag "$NEW_TAG"
          
          # Append footer link for the new release
          if [ -n "$PREV_TAG" ]; then
            echo "" >> "${{ env.CHANGELOG_PATH }}"
            echo "[release/${{ env.RELEASE_DATE }}]: https://github.com/dfinity/dogecoin-canister/compare/${PREV_TAG}...${NEW_TAG}" >> "${{ env.CHANGELOG_PATH }}"
          else
            echo "" >> "${{ env.CHANGELOG_PATH }}"
            echo "[release/${{ env.RELEASE_DATE }}]: https://github.com/dfinity/dogecoin-canister/releases/tag/${NEW_TAG}" >> "${{ env.CHANGELOG_PATH }}"
          fi

      - name: Create PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(${{ inputs.package }}): update changelog for release/${{ env.RELEASE_DATE }}"
          title: "chore(${{ inputs.package }}): release/${{ env.RELEASE_DATE }}"
          body: |
            ## ${{ inputs.package }} release/${{ env.RELEASE_DATE }}

            This PR updates the changelog for ${{ inputs.package }}.

            After merging, run the **Create GitHub Releases** workflow with `${{ inputs.package }}` selected.
          branch: release/${{ env.RELEASE_DATE }}
          labels: release
          draft: true

  # ===== ic-doge-interface Crate Release PR (semver) =====
  ic-doge-interface:
    name: Create Release PR for ic-doge-interface crate
    if: ${{ inputs.package == 'ic-doge-interface' }}
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Release PR (release-plz)
        # Creates a single PR for ic-doge-interface
        uses: release-plz/action@5ab144c9d67d4346240190d0f95ed08668677928 # v0.5.121
        with:
          command: release-pr
          version: 0.3.151
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}