name: CI

env:
  RUST_VERSION: 1.90.0
  DFX_VERSION: 0.29.2
  POCKET_IC_SERVER_VERSION: 11.0.0
  CARGO_TERM_COLOR: always # Force Cargo to use colors
  TERM: xterm-256color

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  cargo-build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-1

      - name: Install Rust
        run: |
          rustup update ${RUST_VERSION} --no-self-update
          rustup default ${RUST_VERSION}
          rustup target add wasm32-unknown-unknown

      - name: Build
        shell: bash
        run: |
          cargo build --release --all-targets
          cargo build --release --bin build-utxos --bin main-state-builder --features=file_memory
        env:
          RUST_BACKTRACE: 1

  cargo-tests:
    runs-on: ${{ matrix.os }}
    needs: cargo-build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          lfs: true
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-1

      - name: Install Rust
        run: |
          rustup update ${RUST_VERSION} --no-self-update
          rustup default ${RUST_VERSION}
          rustup target add wasm32-unknown-unknown

      - name: Install PocketIC (mac)
        if: runner.os == 'macOS'
        run: |
          wget https://github.com/dfinity/pocketic/releases/download/$POCKET_IC_SERVER_VERSION/pocket-ic-x86_64-darwin.gz
          gzip -d pocket-ic-x86_64-darwin.gz
          mv pocket-ic-x86_64-darwin pocket-ic
          chmod +x pocket-ic
          mv pocket-ic ./canister/

      - name: Install PocketIC (linux)
        if: runner.os == 'Linux'
        run: |
          wget https://github.com/dfinity/pocketic/releases/download/$POCKET_IC_SERVER_VERSION/pocket-ic-x86_64-linux.gz
          gzip -d pocket-ic-x86_64-linux.gz
          mv pocket-ic-x86_64-linux pocket-ic
          chmod +x pocket-ic
          mv pocket-ic ./canister/

      - name: Install brew packages (mac)
        if: runner.os == 'macOS'
        run: |
          brew install llvm

      - name: Run Tests
        shell: bash
        run: |
          cargo test --release --all-targets --workspace --exclude benchmarks -- --color always
          cargo test -p ic-doge-validation --lib --features btc
        env:
          RUST_BACKTRACE: 1

  cargo-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-1

      - name: Install Rust + Clippy
        run: |
          rustup update ${RUST_VERSION} --no-self-update
          rustup default ${RUST_VERSION}
          rustup target add wasm32-unknown-unknown
          rustup component add clippy

      - uses: actions-rs/clippy-check@b5b5f21f4797c02da247df37026fcd0a5024aa4d # v1.0.7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          args: --all-targets -- -D warnings

  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust + Clippy
        run: |
          rustup update ${RUST_VERSION} --no-self-update
          rustup default ${RUST_VERSION}

      - name: Install Rust + Rustfmt
        run: |
          rustup update ${RUST_VERSION} --no-self-update
          rustup default ${RUST_VERSION}
          rustup component add rustfmt

      - uses: actions-rs/cargo@844f36862e911db73fe0815f00a4a2602c279505 # v1.0.3
        with:
          command: fmt
          args: --all -- --check

  shell-checks:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca # master
        env:
          SHELLCHECK_OPTS: -e SC1090 -e SC2119 -e SC1091

  e2e-scenario-1:
    runs-on: ubuntu-latest
    needs: [cargo-build, canister-build-reproducibility]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-1

      - name: Download WASMs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wasms
          path: ./wasms

      - name: Install Rust
        run: |
          rustup update ${{ matrix.rust }} --no-self-update
          rustup default ${{ matrix.rust }}
          rustup target add wasm32-unknown-unknown

      - name: Install dfx
        uses: dfinity/setup-dfx@e50c04f104ee4285ec010f10609483cf41e4d365 # main
        with:
          dfx-version: $DFX_VERSION

      - name: Run scenario 1
        run: |
          bash e2e-tests/scenario-1.sh

  e2e-scenario-2:
    runs-on: ubuntu-latest
    needs: [cargo-build, canister-build-reproducibility]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-1

      - name: Download WASMs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wasms
          path: ./wasms

      - name: Install Rust
        run: |
          rustup update ${{ matrix.rust }} --no-self-update
          rustup default ${{ matrix.rust }}
          rustup target add wasm32-unknown-unknown

      - name: Install dfx
        uses: dfinity/setup-dfx@e50c04f104ee4285ec010f10609483cf41e4d365 # main
        with:
          dfx-version: $DFX_VERSION

      - name: Run scenario 2
        run: |
          bash e2e-tests/scenario-2.sh

  e2e-scenario-3:
    runs-on: ubuntu-latest
    needs: [cargo-build, canister-build-reproducibility]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-1

      - name: Download WASMs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wasms
          path: ./wasms

      - name: Install Rust
        run: |
          rustup update ${{ matrix.rust }} --no-self-update
          rustup default ${{ matrix.rust }}
          rustup target add wasm32-unknown-unknown

      - name: Install dfx
        uses: dfinity/setup-dfx@e50c04f104ee4285ec010f10609483cf41e4d365 # main
        with:
          dfx-version: $DFX_VERSION

      - name: Run scenario 3
        run: |
          bash e2e-tests/scenario-3.sh

  e2e-disable-api-if-not-fully-synced-flag:
    runs-on: ubuntu-latest
    needs: [cargo-build, canister-build-reproducibility]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-1

      - name: Download WASMs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wasms
          path: ./wasms

      - name: Install Rust
        run: |
          rustup update ${{ matrix.rust }} --no-self-update
          rustup default ${{ matrix.rust }}
          rustup target add wasm32-unknown-unknown

      - name: Install dfx
        uses: dfinity/setup-dfx@e50c04f104ee4285ec010f10609483cf41e4d365 # main
        with:
          dfx-version: $DFX_VERSION

      - name: Run disable api if not fully synced flag
        run: |
          bash e2e-tests/disable-api-if-not-fully-synced-flag.sh

  charge-cycles-on-reject:
    runs-on: ubuntu-latest
    needs: [cargo-build, canister-build-reproducibility]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-1

      - name: Download WASMs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wasms
          path: ./wasms

      - name: Install Rust
        run: |
          rustup update ${{ matrix.rust }} --no-self-update
          rustup default ${{ matrix.rust }}
          rustup target add wasm32-unknown-unknown

      - name: Install dfx
        uses: dfinity/setup-dfx@e50c04f104ee4285ec010f10609483cf41e4d365 # main
        with:
          dfx-version: $DFX_VERSION

      - name: Run charge cycles on reject
        run: |
          bash e2e-tests/charge-cycles-on-reject.sh

  upgradability:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'CI_OVERRIDE_UPGRADABILITY_CHECK') }}
    runs-on: ubuntu-latest
    needs: canister-build-reproducibility

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download WASMs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wasms
          path: ./wasms

      - name: Install dfx
        uses: dfinity/setup-dfx@e50c04f104ee4285ec010f10609483cf41e4d365 # main
        with:
          dfx-version: $DFX_VERSION

      - name: Run upgradability test
        run: |
          bash e2e-tests/upgradability.sh

  set_config:
    runs-on: ubuntu-latest
    needs: canister-build-reproducibility

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download WASMs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wasms
          path: ./wasms

      - name: Install dfx
        uses: dfinity/setup-dfx@e50c04f104ee4285ec010f10609483cf41e4d365 # main
        with:
          dfx-version: $DFX_VERSION

      - name: Run set_config test
        run: |
          bash e2e-tests/set_config.sh

  post_upgrade_config:
    runs-on: ubuntu-latest
    needs: canister-build-reproducibility

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download WASMs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wasms
          path: ./wasms

      - name: Install dfx
        uses: dfinity/setup-dfx@e50c04f104ee4285ec010f10609483cf41e4d365 # main
        with:
          dfx-version: $DFX_VERSION

      - name: Run post_upgrade_config test
        run: |
          bash e2e-tests/post_upgrade_config.sh

  cycles_burn:
    runs-on: ubuntu-latest
    needs: canister-build-reproducibility

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download WASMs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wasms
          path: ./wasms

      - name: Install dfx
        uses: dfinity/setup-dfx@e50c04f104ee4285ec010f10609483cf41e4d365 # main
        with:
          dfx-version: $DFX_VERSION

      - name: Run cycles_burn test
        run: bash e2e-tests/cycles_burn.sh

  dogecoin_canister_metadata:
    runs-on: ubuntu-latest
    needs: canister-build-reproducibility

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download WASMs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wasms
          path: ./wasms

      - name: Install dfx
        uses: dfinity/setup-dfx@e50c04f104ee4285ec010f10609483cf41e4d365 # main
        with:
          dfx-version: $DFX_VERSION

      - name: Run dogecoin_canister_metadata test
        run: bash e2e-tests/dogecoin-canister-metadata.sh

  benchmark:
    runs-on: ubuntu-latest
    needs: cargo-build
    strategy:
      matrix:
        name:
          - legacy
          - auxpow

        include:
          - name: legacy
            project_dir: ./benchmarks/legacy
          - name: auxpow
            project_dir: ./benchmarks/auxpow

    env:
      PROJECT_DIR: ${{ matrix.project_dir }}
    steps:
      - name: Checkout current PR
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Checkout baseline branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: master
          path: _canbench_baseline_branch

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-1

      - name: Install Rust
        run: |
          rustup update ${RUST_VERSION} --no-self-update
          rustup default ${RUST_VERSION}
          rustup target add wasm32-unknown-unknown

      - name: Benchmark
        run: |
          bash ./scripts/canbench_ci_run_benchmark.sh $PROJECT_DIR ${{ matrix.name }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canbench_result_${{ matrix.name }}
          path: /tmp/canbench_result_${{ matrix.name }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canbench_results_persisted_${{ matrix.name }}_yml
          path: /tmp/canbench_results_persisted_${{ matrix.name }}.yml

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canbench_results_${{ matrix.name }}_csv
          path: /tmp/canbench_results_${{ matrix.name }}.csv

      - name: Pass or fail
        run: |
          bash ./scripts/canbench_ci_post_run_benchmark.sh

  upload-pr-number:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Save PR number
        run: |
          echo ${{ github.event.number }} > /tmp/pr_number

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr_number
          path: /tmp/pr_number

  canister-build-reproducibility:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Verify Reproducibility
        run: |
          ./e2e-tests/reproducibility.sh Dockerfile

      - name: Archive WASMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wasms
          path: ./wasms
          if-no-files-found: error
          compression-level: 0

  check-canister-wasm-endpoints:
    runs-on: ubuntu-latest
    needs: canister-build-reproducibility
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download WASMs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wasms
          path: ./wasms

      - name: Install `ic-wasm`
        uses: taiki-e/install-action@97a5807a604e12de3a13b52d868ebecaeeea757c # v2.75.4
        with:
          tool: ic-wasm

      - name: Check canister endpoints
        run: |
          echo "::group::Checking Dogecoin canister endpoints"
          ic-wasm "$GITHUB_WORKSPACE/wasms/ic-doge-canister.wasm.gz" check-endpoints \
            --hidden ./canister/hidden_endpoints.conf
          echo "::endgroup::"

          echo "::group::Checking uploader canister endpoints"
          ic-wasm "$GITHUB_WORKSPACE/wasms/uploader.wasm.gz" check-endpoints \
            --hidden ./bootstrap/uploader/hidden_endpoints.conf \
            --candid ./bootstrap/uploader/candid.did
          echo "::endgroup::"

  candid-compatibility:
    name: Check Candid Compatibility
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'CI_OVERRIDE_DIDC_CHECK') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Need full history to compare with base

      - name: Download didc
        if: steps.cache-didc.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          curl -fsSL https://github.com/dfinity/candid/releases/download/2025-12-18/didc-linux64 \
            -o ~/.local/bin/didc
          chmod +x ~/.local/bin/didc

      - name: Add didc to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run Candid compatibility checks
        run: |
          chmod +x scripts/check-candid-compatibility.sh
          DID_CHECK_REV=${{ github.event.pull_request.base.sha }} \
            ./scripts/check-candid-compatibility.sh

  checks-pass:
    # Always run this job!
    if: always()
    needs:
      [
        cargo-tests,
        shell-checks,
        cargo-clippy,
        rustfmt,
        e2e-disable-api-if-not-fully-synced-flag,
        e2e-scenario-1,
        e2e-scenario-2,
        e2e-scenario-3,
        charge-cycles-on-reject,
        upgradability,
        set_config,
        cycles_burn,
        benchmark,
        canister-build-reproducibility,
        check-canister-wasm-endpoints,
        dogecoin_canister_metadata,
        candid-compatibility,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: check cargo-tests result
        if: ${{ needs.cargo-tests.result != 'success' }}
        run: exit 1
      - name: check shell-checks result
        if: ${{ needs.shell-checks.result != 'success' }}
        run: exit 1
      - name: check cargo-clippy result
        if: ${{ needs.cargo-clippy.result != 'success' }}
        run: exit 1
      - name: check rustfmt result
        if: ${{ needs.rustfmt.result != 'success' }}
        run: exit 1
      - name: check e2e-disable-api-if-not-fully-synced-flag result
        if: ${{ needs.e2e-disable-api-if-not-fully-synced-flag.result != 'success' }}
        run: exit 1
      - name: check e2e-scenario-1 result
        if: ${{ needs.e2e-scenario-1.result != 'success' }}
        run: exit 1
      - name: check e2e-scenario-2 result
        if: ${{ needs.e2e-scenario-2.result != 'success' }}
        run: exit 1
      - name: check e2e-scenario-3 result
        if: ${{ needs.e2e-scenario-3.result != 'success' }}
        run: exit 1
      - name: check charge-cycles-on-reject result
        if: ${{ needs.charge-cycles-on-reject.result != 'success' }}
        run: exit 1
      - name: check upgradability result
        if: ${{ needs.upgradability.result != 'success' && needs.upgradability.result != 'skipped' }}
        run: exit 1
      - name: check set_config result
        if: ${{ needs.set_config.result != 'success' }}
        run: exit 1
      - name: check cycles_burn result
        if: ${{ needs.cycles_burn.result != 'success' }}
        run: exit 1
      - name: check dogecoin_canister_metadata result
        if: ${{ needs.dogecoin_canister_metadata.result != 'success' }}
        run: exit 1
      - name: check benchmark result
        if: ${{ needs.benchmark.result != 'success' }}
        run: exit 1
      - name: check canister-build-reproducibility result
        if: ${{ needs.canister-build-reproducibility.result != 'success' }}
        run: exit 1
      - name: check check-canister-wasm-endpoints result
        if: ${{ needs.check-canister-wasm-endpoints.result != 'success' }}
        run: exit 1
      - name: check candid-compatibility result
        if: ${{ needs.candid-compatibility.result != 'success' && needs.candid-compatibility.result != 'skipped' }}
        run: exit 1
